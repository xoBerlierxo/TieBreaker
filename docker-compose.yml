# Local development stack: api + worker + postgres + redis (SPEC §3, §20 M0).
#
#   docker compose up -d --build
#   curl localhost:8080/healthz
#   curl localhost:8080/readyz
#
# Values below are DEVELOPMENT-ONLY defaults so the stack starts without any
# setup. Override them in a local .env file (see .env.example). Never use these
# defaults in production.
name: tiebreaker

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://tiebreaker:${POSTGRES_PASSWORD:-tiebreaker_dev_only}@postgres:5432/tiebreaker?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiebreaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiebreaker_dev_only}
      POSTGRES_DB: tiebreaker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiebreaker -d tiebreaker"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: tiebreaker:dev
    command: ["serve"]
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: tiebreaker:dev   # same image as api; the second build is a cache hit
    command: ["worker"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
